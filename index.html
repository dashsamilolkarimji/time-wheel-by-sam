<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Time Wheel by Sam</title><style>body{font-family:Arial;text-align:center;background:#f5f7fb;margin:0;color:#111}header{padding:18px;background:white;font-size:24px;font-weight:900}main{max-width:700px;margin:30px auto;padding:20px}.card{background:white;padding:25px;border-radius:20px;box-shadow:0 4px 20px #0001}.wheelbox{position:relative;width:min(90vw,460px);margin:20px auto}svg{width:100%;display:block;transform-origin:50% 50%}.pointer{position:absolute;z-index:2;top:-4px;left:50%;transform:translateX(-50%);border-left:20px solid transparent;border-right:20px solid transparent;border-top:40px solid #111}button{padding:14px 22px;margin:5px;border:0;border-radius:12px;background:#2563eb;color:white;font-weight:900;font-size:16px}button:disabled{opacity:.5}.time{font-size:55px;font-weight:900}.bar{height:24px;background:#ddd;border-radius:20px;overflow:hidden}.fill{height:100%;width:0;background:#2563eb}.good{font-size:55px;font-weight:1000}#timer,#done{display:none;margin-top:20px}</style></head><body><header>🎡 Time Wheel by Sam</header><main><div class="card"><h1>Pick Your Time</h1><p>Spin for a random 15–30 minute session.</p><div class="wheelbox"><div class="pointer"></div><svg id="wheel" viewBox="0 0 500 500"></svg></div><button id="spin">🎡 SPIN THE WHEEL</button><button id="skip" disabled>⏭️ SKIP</button><h2 id="result"></h2></div><div id="timer" class="card"><b>YOUR TIME</b><div id="display" class="time">00:00</div><div class="bar"><div id="fill" class="fill"></div></div><p id="pct">0% complete</p></div><div id="done" class="card"><div>😄</div><div class="good">GOOD JOB!</div><p>You finished your time! 🎉</p><button id="again">🔄 SPIN AGAIN</button></div></main><script>const s=document.getElementById('wheel'),N=16,st=22.5,c=250,R=238,NS='http://www.w3.org/2000/svg';let rot=0,id,total,start;function pt(a,r){a*=Math.PI/180;return[c+r*Math.sin(a),c-r*Math.cos(a)]}for(let i=0;i<N;i++){let a=pt(i*st,R),b=pt((i+1)*st,R),p=document.createElementNS(NS,'path');p.setAttribute('d',`M 250 250 L ${a[0]} ${a[1]} A ${R} ${R} 0 0 1 ${b[0]} ${b[1]} Z`);p.setAttribute('fill',`hsl(${i*22.5},80%,65%)`);p.setAttribute('stroke','white');s.appendChild(p);let q=pt(i*st+st/2,175),t=document.createElementNS(NS,'text');t.setAttribute('x',q[0]);t.setAttribute('y',q[1]);t.setAttribute('text-anchor','middle');t.setAttribute('dominant-baseline','middle');t.setAttribute('font-size','23');t.setAttribute('font-weight','900');t.textContent=15+i;s.appendChild(t)}function fmt(x){x=Math.max(0,Math.ceil(x));return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')}function finish(){clearInterval(id);document.getElementById('timer').style.display='none';document.getElementById('done').style.display='block';document.getElementById('spin').disabled=false;document.getElementById('skip').disabled=true}function run(){document.getElementById('timer').style.display='block';start=Date.now();function tick(){let e=(Date.now()-start)/1000,p=Math.min(1,e/total);document.getElementById('display').textContent=fmt(total-e);document.getElementById('fill').style.width=p*100+'%';document.getElementById('pct').textContent=Math.round(p*100)+'% complete';if(p>=1)finish()}id=setInterval(tick,250);tick()}document.getElementById('spin').onclick=()=>{document.getElementById('spin').disabled=true;const chosen=15+Math.floor(Math.random()*16),idx=chosen-15,center=idx*st+st/2,current=((rot%360)+360)%360,delta=(360-center-current+360)%360;rot+=delta+2520;s.style.transition='transform 4.5s cubic-bezier(.12,.8,.18,1)';s.style.transform=`rotate(${rot}deg)`;setTimeout(()=>{document.getElementById('result').textContent=`🎯 LANDED ON ${chosen} MINUTES!`;total=chosen*60;document.getElementById('skip').disabled=false;run()},4700)};document.getElementById('skip').onclick=finish;document.getElementById('again').onclick=()=>location.reload();</script></body></html>
